name: App
options:
  bundleIdPrefix: ke.droidcon.hakka
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  App:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: hakka
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ke.droidcon.hakka.App
        GENERATE_INFOPLIST_FILE: "YES"
  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: App
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  App:
    build:
      targets:
        App: all
    test:
      targets: [AppTests]
